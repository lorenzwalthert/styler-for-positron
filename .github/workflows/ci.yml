name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  # ── Unit tests (fast, no VS Code host, no R required) ──────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  # ── Integration tests (real VS Code host + R + styler) ─────────────────────
  integration-tests:
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install styler R package
        shell: Rscript {0}
        run: |
          install.packages("styler", repos = "https://cloud.r-project.org")

      - name: Export Rscript path (macOS PATH fix)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          RSCRIPT_PATH="$(which Rscript)"
          echo "RSCRIPT_PATH=$RSCRIPT_PATH" >> "$GITHUB_ENV"
          echo "Rscript found at: $RSCRIPT_PATH"

      # macOS: strip Gatekeeper quarantine from the downloaded VS Code bundle
      # and ensure the Electron binary is executable.  Without this, macOS may
      # refuse to launch Electron with ENOENT / permission errors in CI.
      - name: Fix VS Code permissions (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VSCODE_DIR=".vscode-test"
          if [ -d "$VSCODE_DIR" ]; then
            find "$VSCODE_DIR" -name "Electron" -exec chmod +x {} \;
            xattr -rd com.apple.quarantine "$VSCODE_DIR" 2>/dev/null || true
            echo "Fixed permissions in $VSCODE_DIR"
          fi

      # ── Linux: install Xvfb and run tests through a virtual display ─────────
      - name: Install Xvfb (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb

      - name: Run integration tests (Linux — Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run integration tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm test
